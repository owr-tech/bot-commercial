services:
  - type: web
    name: popaix-bot-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: AI_PROVIDER
        value: mistral
      - key: MISTRAL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WABA_ID
        sync: false
      - key: WA_FLOW_NAME
        value: popaix_dates
      - key: WHATSAPP_REDIRECT_NUMBER
        value: "2250702391982"
      - key: VERIFY_TOKEN
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: popaixbot
      - key: PUBLIC_BASE_URL
        value: https://popaix-bot-api.onrender.com
      - key: BOOKING_MAX_MONTHS
        value: "12"
      - key: PAYMENT_PROVIDER
        value: paydunya
      - key: PAYDUNYA_ENV
        value: test
      - key: PAYDUNYA_MASTER_KEY
        sync: false
      - key: PAYDUNYA_PRIVATE_KEY
        sync: false
      - key: PAYDUNYA_TOKEN
        sync: false
      - key: PAYDUNYA_CALLBACK_URL
        value: https://popaix-bot-api.onrender.com/webhook/paydunya
      - key: PAYDUNYA_RETURN_URL
        value: https://popaix-bot-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: popaix-db
          property: connectionString

  - type: worker
    name: popaix-telegram
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: AI_PROVIDER
        value: mistral
      - key: MISTRAL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://popaix-bot-api.onrender.com
      - key: BOOKING_MAX_MONTHS
        value: "12"
      - key: DATABASE_URL
        fromDatabase:
          name: popaix-db
          property: connectionString

databases:
  - name: popaix-db
    plan: free
    databaseName: popaix
    user: popaix