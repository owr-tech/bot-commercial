services:
  - type: web
    name: popaix-bot-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: AI_PROVIDER
        value: mistral
      - key: MISTRAL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: PAYMENT_PROVIDER
        value: none
      - key: DATABASE_URL
        fromDatabase:
          name: popaix-db
          property: connectionString

  - type: worker
    name: popaix-telegram
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: AI_PROVIDER
        value: mistral
      - key: MISTRAL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: popaix-db
          property: connectionString

databases:
  - name: popaix-db
    plan: free
    databaseName: popaix
    user: popaix